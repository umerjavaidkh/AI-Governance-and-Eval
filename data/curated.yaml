# Curated repos — evaluation tooling and AI governance platforms.
# The agent reads this file, never writes to it. Categories are defined in
# config.yaml; `category:` below must match one of its slugs.
#
# EVERY entry MUST have `repo: owner/name`. Entries without one are rejected by
# scripts/update_collection.py — this list is repos only, by design. Papers,
# articles, regulations, standards and frameworks do not belong here.
#
# Required: id, name, org, category, kind, repo, url, summary, best_for, verified
# Optional: docs_url, status, license, rank

meta:
  title: AI Governance and Eval
  tagline: 'Open-source repos only, in two domains: evaluation for LLMs, agents and RAG, and AI governance
    platforms. No papers, no articles, no regulations — if it is not a repo you can clone, it is not here.'
entries:
- id: ai-verify
  name: AI Verify & Model AI Governance Framework for GenAI
  org: IMDA Singapore
  category: governance
  kind: tool
  url: https://aiverifyfoundation.sg/
  repo: aiverify-foundation/aiverify
  license: Apache-2.0
  status: Active
  summary: A governance testing framework with an actual open-source toolkit — technical tests plus process
    checks — rather than prose alone.
  best_for: Teams that want governance claims backed by runnable tests.
  verified: '2026-08-25'
- id: inspect
  name: Inspect
  org: UK AI Security Institute
  category: eval
  kind: tool
  url: https://inspect.aisi.org.uk/
  repo: UKGovernmentBEIS/inspect_ai
  license: MIT
  status: Actively maintained
  summary: The evaluation framework a national safety institute uses on frontier models — solvers, scorers,
    tool use, multi-turn agents and human-in-the-loop, with a proper log viewer.
  best_for: Safety and agentic evals you need to defend to an auditor.
  verified: '2026-08-25'
- id: lm-eval-harness
  name: LM Evaluation Harness
  org: EleutherAI
  category: eval
  kind: tool
  url: https://github.com/EleutherAI/lm-evaluation-harness
  repo: EleutherAI/lm-evaluation-harness
  license: MIT
  status: Actively maintained
  summary: The de facto standard for reproducible academic benchmarking; hundreds of tasks behind one
    interface, and the harness most published numbers come from.
  best_for: Reporting MMLU/HellaSwag-class numbers others can reproduce.
  verified: '2026-08-25'
- id: helm
  name: HELM (Holistic Evaluation of Language Models)
  org: Stanford CRFM
  category: eval
  kind: tool
  url: https://crfm.stanford.edu/helm/
  repo: stanford-crfm/helm
  license: Apache-2.0
  status: Actively maintained
  summary: Multi-metric evaluation by design — accuracy, calibration, robustness, bias, toxicity, efficiency
    — with public leaderboards across domain variants.
  best_for: Arguing that a single accuracy score is not an evaluation.
  verified: '2026-08-25'
- id: opencompass
  name: OpenCompass
  org: Shanghai AI Laboratory
  category: eval
  kind: tool
  url: https://github.com/open-compass/opencompass
  repo: open-compass/opencompass
  license: Apache-2.0
  status: Actively maintained
  summary: Large bilingual (EN/CN) benchmark platform with broad dataset and model coverage, including
    domain suites for finance, healthcare and law.
  best_for: Non-English and domain-specific coverage the Western harnesses miss.
  verified: '2026-08-25'
- id: lighteval
  name: LightEval
  org: Hugging Face
  category: eval
  kind: tool
  url: https://github.com/huggingface/lighteval
  repo: huggingface/lighteval
  license: MIT
  status: Actively maintained
  summary: Lightweight, backend-agnostic evaluation pipeline used in leaderboard-style runs; easy to point
    at vLLM, TGI or an inference endpoint.
  best_for: Fast iteration when a full harness is too heavy.
  verified: '2026-08-25'
- id: metr-task-standard
  name: METR Task Standard
  org: METR
  category: eval
  kind: tool
  url: https://github.com/METR/task-standard
  repo: METR/task-standard
  license: MIT
  status: Stable, low activity
  summary: A specification for defining autonomous-capability tasks portably, so dangerous-capability
    evaluations can be shared and re-run across organisations.
  best_for: Writing agent tasks that another lab can execute unchanged.
  verified: '2026-08-25'
- id: ragas
  name: Ragas
  org: Exploding Gradients
  category: eval
  kind: tool
  url: https://github.com/explodinggradients/ragas
  repo: explodinggradients/ragas
  license: Apache-2.0
  status: Actively maintained
  summary: The principled choice for RAG evaluation — faithfulness, answer relevancy, context precision
    and recall, computed with or without ground truth.
  best_for: Proving a RAG answer is actually grounded in retrieved context.
  verified: '2026-08-25'
- id: deepeval
  name: DeepEval
  org: Confident AI
  category: eval
  kind: tool
  url: https://github.com/confident-ai/deepeval
  repo: confident-ai/deepeval
  license: Apache-2.0
  status: Actively maintained
  summary: Pytest-style evaluation for LLM apps — G-Eval, hallucination, task completion and custom metrics
    that fail a CI build like any other test.
  best_for: Regression-testing an LLM feature in an existing Python CI pipeline.
  verified: '2026-08-25'
- id: promptfoo
  name: promptfoo
  org: promptfoo
  category: eval
  kind: tool
  url: https://github.com/promptfoo/promptfoo
  repo: promptfoo/promptfoo
  license: MIT
  status: Actively maintained
  summary: Declarative YAML matrix testing across prompts, providers and assertions, with a strong adversarial/red-team
    generator. Note - reported in 2026 to be acquired by OpenAI; still MIT-licensed, but weigh vendor
    neutrality.
  best_for: A/B testing a prompt or provider change without writing a harness.
  verified: '2026-08-25'
- id: phoenix
  name: Phoenix
  org: Arize AI
  category: eval
  kind: tool
  url: https://github.com/Arize-ai/phoenix
  repo: Arize-ai/phoenix
  license: Elastic-2.0
  status: Actively maintained
  summary: Self-hostable, OpenTelemetry-native tracing and evaluation — traces become datasets, datasets
    become evals.
  best_for: Observability and eval in one place, on your own infrastructure.
  verified: '2026-08-25'
- id: langfuse
  name: Langfuse
  org: Langfuse
  category: eval
  kind: tool
  url: https://github.com/langfuse/langfuse
  repo: langfuse/langfuse
  license: MIT (core)
  status: Actively maintained
  summary: Open-source LLM observability with datasets, scores, prompt management and human annotation
    queues; framework-agnostic.
  best_for: Self-hosted production tracing with an evaluation loop attached.
  verified: '2026-08-25'
- id: trulens
  name: TruLens
  org: Snowflake
  category: eval
  kind: tool
  url: https://github.com/truera/trulens
  repo: truera/trulens
  license: MIT
  status: Actively maintained
  summary: Feedback-function approach to RAG and agent evaluation, with a native Snowflake path for enterprises
    already on that stack.
  best_for: Snowflake-resident data and governance requirements.
  verified: '2026-08-25'
- id: giskard
  name: Giskard
  org: Giskard AI
  category: eval
  kind: tool
  url: https://github.com/Giskard-AI/giskard
  repo: Giskard-AI/giskard
  license: Apache-2.0
  status: Actively maintained
  summary: Automated vulnerability scanning for ML and LLM apps — hallucination, bias, prompt injection,
    harmfulness — with reports oriented to EU AI Act evidence.
  best_for: Generating compliance-shaped evidence from an automated scan.
  verified: '2026-08-25'
- id: garak
  name: garak
  org: NVIDIA
  category: eval
  kind: tool
  url: https://github.com/NVIDIA/garak
  repo: NVIDIA/garak
  license: Apache-2.0
  status: Actively maintained
  summary: An LLM vulnerability scanner in the nmap tradition — dozens of probes for jailbreaks, prompt
    injection, data leakage, toxicity and encoding attacks.
  best_for: A first automated red-team pass on any endpoint, in one command.
  verified: '2026-08-25'
- id: pyrit
  name: PyRIT
  org: Microsoft
  category: eval
  kind: tool
  url: https://github.com/microsoft/PyRIT
  repo: microsoft/PyRIT
  license: MIT
  status: Actively maintained
  summary: Python Risk Identification Toolkit — orchestrators, converters and scorers for automating multi-turn
    adversarial probing of generative AI.
  best_for: Scaling a manual red-team playbook into repeatable automation.
  verified: '2026-08-25'
- id: purple-llama
  name: Purple Llama / CyberSecEval
  org: Meta
  category: eval
  kind: tool
  url: https://github.com/meta-llama/PurpleLlama
  repo: meta-llama/PurpleLlama
  license: Custom
  status: Active
  summary: Cybersecurity safety evaluations plus input/output guard models (Llama Guard, Code Shield)
    for insecure-code and attack-compliance testing.
  best_for: Measuring whether a coding assistant emits insecure code.
  verified: '2026-08-25'
- id: swe-bench
  name: SWE-bench
  org: Princeton NLP
  category: eval
  kind: tool
  url: https://www.swebench.com/
  repo: SWE-bench/SWE-bench
  license: MIT
  status: Active
  summary: Real GitHub issues resolved against real repositories, graded by whether the test suite passes
    — the reference agentic coding benchmark.
  best_for: Evaluating coding agents on work that resembles the actual job.
  verified: '2026-08-25'
- id: aiid
  name: AI Incident Database
  org: Responsible AI Collaborative
  category: governance
  kind: tool
  url: https://incidentdatabase.ai/
  repo: responsible-ai-collaborative/aiid
  license: MIT
  status: Continuously updated
  summary: Indexed, citable record of real-world AI harms — the empirical base for risk assessments that
    would otherwise be speculative.
  best_for: Grounding a risk register in incidents that actually happened.
  verified: '2026-08-25'
- id: responsible-ai-toolbox
  name: Responsible AI Toolbox
  org: Microsoft
  category: governance
  kind: tool
  repo: microsoft/responsible-ai-toolbox
  url: https://github.com/microsoft/responsible-ai-toolbox
  summary: Model debugging dashboard combining error analysis, fairness assessment, interpretability and
    counterfactuals in one pane.
  best_for: Producing the evidence pack behind a model risk sign-off.
  verified: '2026-08-25'
- id: fairlearn
  name: Fairlearn
  org: Fairlearn / contributors
  category: governance
  kind: tool
  repo: fairlearn/fairlearn
  url: https://github.com/fairlearn/fairlearn
  summary: Assesses group fairness with disaggregated metrics and applies mitigation algorithms to reduce
    disparity.
  best_for: Measuring and mitigating disparate impact across protected groups.
  verified: '2026-08-25'
- id: aif360
  name: AI Fairness 360
  org: IBM / LF AI & Data
  category: governance
  kind: tool
  repo: Trusted-AI/AIF360
  url: https://github.com/Trusted-AI/AIF360
  summary: Bias metrics and mitigation algorithms spanning pre-processing, in-processing and post-processing.
  best_for: A broad menu of bias metrics when you don't yet know which one applies.
  verified: '2026-08-25'
- id: interpret
  name: InterpretML
  org: InterpretML
  category: governance
  kind: tool
  repo: interpretml/interpret
  url: https://github.com/interpretml/interpret
  summary: Glassbox models plus black-box explanation techniques under one API.
  best_for: Explaining a decision to someone who will not accept 'the model said so'.
  verified: '2026-08-25'
- id: captum
  name: Captum
  org: Meta / PyTorch
  category: governance
  kind: tool
  repo: meta-pytorch/captum
  url: https://github.com/meta-pytorch/captum
  summary: Attribution and interpretability primitives for PyTorch models.
  best_for: Attribution on deep models you own the weights for.
  verified: '2026-08-25'
- id: evidently
  name: Evidently
  org: Evidently AI
  category: governance
  kind: tool
  repo: evidentlyai/evidently
  url: https://github.com/evidentlyai/evidently
  summary: Monitoring and reporting for data drift, data quality and model/LLM performance in production.
  best_for: Catching drift after deployment, when the risk register says you must.
  verified: '2026-08-25'
- id: alibi-detect
  name: Alibi Detect
  org: Seldon
  category: governance
  kind: tool
  repo: SeldonIO/alibi-detect
  url: https://github.com/SeldonIO/alibi-detect
  summary: Outlier, adversarial and drift detection across tabular, text and image data.
  best_for: Drift and outlier detection as a monitoring control.
  verified: '2026-08-25'
- id: presidio
  name: Presidio
  org: Microsoft
  category: governance
  kind: tool
  repo: data-privacy-stack/presidio
  url: https://github.com/data-privacy-stack/presidio
  summary: Detects and anonymises PII in text and images with configurable recognisers.
  best_for: Keeping personal data out of prompts, logs and training sets.
  verified: '2026-08-25'
- id: whylogs
  name: whylogs
  org: WhyLabs
  category: governance
  kind: tool
  repo: whylabs/whylogs
  url: https://github.com/whylabs/whylogs
  summary: Logs statistical profiles of data and model inputs/outputs for monitoring and audit trails.
  best_for: A lightweight, privacy-preserving audit trail of what the model saw.
  verified: '2026-08-25'
