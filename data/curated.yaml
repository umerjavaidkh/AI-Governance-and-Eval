# Curated entries — TIER 1 (authoritative) and TIER 2 (verified tooling).
# The agent reads this file, never writes to it. Categories are defined in
# config.yaml; `category:` below must match one of its slugs.
#
# An entry WITHOUT `repo:` is tier 1 (authoritative, no GitHub presence).
# An entry WITH `repo:` is tier 2 (vetted tooling; stars refreshed weekly).
#
# Required: id, name, org, category, kind, url, summary, best_for, verified
# Optional: repo (owner/name), docs_url, jurisdiction, status, license

meta:
  title: Awesome AI Governance & Evaluation
  tagline: A curated, weekly-verified map of the AI governance frameworks and evaluation
    harnesses that regulators, auditors and frontier labs actually use.

entries:

  # ---------------------------------------------------------- Law & Regulation
  - id: eu-ai-act
    rank: 1
    name: EU AI Act (Regulation 2024/1689)
    org: European Union
    category: regulation
    kind: regulation
    jurisdiction: EU
    url: https://artificialintelligenceact.eu/
    docs_url: https://artificialintelligenceact.eu/implementation-timeline/
    status: In force, phased
    summary: The world's first horizontal, risk-tiered AI law. Prohibited practices and AI-literacy
      duties live since Feb 2025; GPAI model obligations since Aug 2025; Article 50 transparency
      duties and AI Office enforcement over GPAI providers since 2 Aug 2026.
    best_for: Anyone placing an AI system or GPAI model on the EU market.
    verified: '2026-08-25'
  - id: eu-digital-omnibus-ai
    rank: 3
    name: Digital Omnibus on AI (Regulation (EU) 2026/1744)
    org: European Union
    category: regulation
    kind: regulation
    jurisdiction: EU
    url: https://artificialintelligenceact.eu/
    status: In force since 27 Jul 2026
    summary: Amending regulation that defers the heaviest high-risk obligations — Annex III
      standalone systems to 2 Dec 2027 and Annex I product-embedded systems to 2 Aug 2028
      — with fixed dates, not standards-contingent triggers. Transparency and GPAI duties
      were untouched.
    best_for: Re-planning a high-risk conformity programme that was scoped to Aug 2026.
    verified: '2026-08-25'
  - id: coe-framework-convention
    name: Council of Europe Framework Convention on AI
    org: Council of Europe
    category: regulation
    kind: regulation
    jurisdiction: International
    url: https://www.coe.int/en/web/artificial-intelligence/the-framework-convention-on-artificial-intelligence
    status: Open for signature
    summary: First legally binding international treaty on AI, anchored in human rights, democracy
      and rule of law; signatories include non-European states.
    best_for: Multinationals mapping obligations beyond the EU.
    verified: '2026-08-25'
  - id: us-state-ai-tracker
    name: US State AI Legislation Tracker
    org: IAPP
    category: regulation
    kind: tracker
    jurisdiction: US
    url: https://iapp.org/resources/article/us-state-ai-governance-legislation-tracker/
    status: Continuously updated
    summary: The practical way to follow a fragmented US landscape — including Colorado, whose
      original AI Act was repealed and replaced by a statute signed 14 May 2026 that dropped
      the NIST/ISO safe harbour.
    best_for: US-facing compliance teams without a 50-state law firm budget.
    verified: '2026-08-25'

  # -------------------------------------- Risk Management & Management Systems
  - id: nist-ai-rmf
    rank: 1
    name: NIST AI Risk Management Framework 1.0
    org: NIST
    category: risk
    kind: framework
    jurisdiction: US
    url: https://www.nist.gov/itl/ai-risk-management-framework
    status: Voluntary, de facto US baseline
    summary: Four functions — Govern, Map, Measure, Manage — that structure AI risk decisions
      across the lifecycle. Voluntary on paper, but referenced by FTC, CFPB, FDA, SEC and
      EEOC guidance and crosswalked to ISO/IEC 42001.
    best_for: Standing up a governance programme from zero without buying certification.
    verified: '2026-08-25'
  - id: nist-genai-profile
    rank: 3
    name: NIST Generative AI Profile (AI 600-1)
    org: NIST
    category: risk
    kind: framework
    jurisdiction: US
    url: https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-generative-artificial-intelligence
    status: Published
    summary: Companion profile translating AI RMF functions into ~200 concrete actions for
      generative AI risks such as confabulation, data leakage and CBRN uplift.
    best_for: Turning the abstract AI RMF into a real control list for a GenAI product.
    verified: '2026-08-25'
  - id: iso-42001
    rank: 2
    name: ISO/IEC 42001 — AI Management System
    org: ISO/IEC
    category: risk
    kind: standard
    jurisdiction: International
    url: https://www.iso.org/standard/42001
    status: Certifiable
    summary: The certifiable AI management system standard (an ISO 27001 analogue for AI).
      Documented policies, lifecycle controls, internal audit, third-party certification.
    best_for: Unblocking enterprise procurement that demands an auditable badge.
    verified: '2026-08-25'
  - id: iso-23894
    name: ISO/IEC 23894 — AI Risk Management Guidance
    org: ISO/IEC
    category: risk
    kind: standard
    jurisdiction: International
    url: https://www.iso.org/standard/77304.html
    status: Published
    summary: Applies ISO 31000 risk management to AI; the methodology layer under an ISO/IEC
      42001 management system.
    best_for: Teams that already run ISO 31000 enterprise risk.
    verified: '2026-08-25'
  - id: iso-42005
    name: ISO/IEC 42005 — AI System Impact Assessment
    org: ISO/IEC
    category: risk
    kind: standard
    jurisdiction: International
    url: https://www.iso.org/standard/44545.html
    status: Published
    summary: Guidance for documenting impacts of AI systems on individuals and society — the
      closest ISO analogue to a fundamental rights impact assessment.
    best_for: Building an FRIA/DPIA-adjacent artefact that survives audit.
    verified: '2026-08-25'
  - id: oecd-ai-principles
    name: OECD AI Principles & Policy Observatory
    org: OECD
    category: risk
    kind: framework
    jurisdiction: International
    url: https://oecd.ai/
    status: Adopted, widely referenced
    summary: The intergovernmental principles most other regimes cite, plus a live observatory
      of national AI policies and a shared AI incident monitor.
    best_for: Baseline vocabulary that maps cleanly onto EU, US and G7 texts.
    verified: '2026-08-25'
  - id: ai-verify
    name: AI Verify & Model AI Governance Framework for GenAI
    org: IMDA Singapore
    category: risk
    kind: framework
    jurisdiction: Singapore
    url: https://aiverifyfoundation.sg/
    repo: aiverify-foundation/aiverify
    license: Apache-2.0
    status: Active
    summary: A governance testing framework with an actual open-source toolkit — technical
      tests plus process checks — rather than prose alone.
    best_for: Teams that want governance claims backed by runnable tests.
    verified: '2026-08-25'
  - id: nist-caisi
    name: NIST CAISI & AI Agent Standards Initiative
    org: NIST CAISI
    category: risk
    kind: framework
    jurisdiction: US
    url: https://www.nist.gov/caisi
    status: Active, guidance emerging
    summary: The US centre for AI standards; launched an AI Agent Standards Initiative in
      Feb 2026, with agentic threat surface covered in NIST AI 100-2 and draft NIST IR 8596
      mapping cyber functions to AI risk.
    best_for: Anyone shipping autonomous agents into a regulated US environment.
    verified: '2026-08-25'

  # ----------------------------------------------- AI Security & Threat Models
  - id: owasp-genai
    rank: 1
    name: OWASP Top 10 for LLM Applications
    org: OWASP GenAI Security Project
    category: security
    kind: framework
    url: https://genai.owasp.org/
    status: Actively maintained
    summary: The common language for LLM application risk — prompt injection, insecure output
      handling, supply chain, excessive agency — plus companion guides for agentic threats
      and red teaming.
    best_for: Threat modelling an LLM or RAG application in language reviewers know.
    verified: '2026-08-25'
  - id: mitre-atlas
    rank: 2
    name: MITRE ATLAS
    org: MITRE
    category: security
    kind: framework
    url: https://atlas.mitre.org/
    status: Actively maintained
    summary: ATT&CK-style knowledge base of real-world adversary tactics and techniques against
      AI systems, with case studies and mitigations.
    best_for: Mapping detections and red-team scope to named adversary behaviours.
    verified: '2026-08-25'
  - id: csa-aicm
    name: CSA AI Controls Matrix (AICM)
    org: Cloud Security Alliance
    category: security
    kind: standard
    url: https://cloudsecurityalliance.org/artifacts/ai-controls-matrix
    status: Published
    summary: Control catalogue for AI systems in cloud environments, with mappings to ISO/IEC
      42001, NIST AI RMF and the EU AI Act.
    best_for: Answering vendor security questionnaires without reinventing controls.
    verified: '2026-08-25'
  - id: google-saif
    name: Google Secure AI Framework (SAIF)
    org: Google
    category: security
    kind: framework
    url: https://saif.google/
    status: Active
    summary: Six-element security framework for AI, with a self-assessment that produces a
      risk report rather than a checklist.
    best_for: A fast, opinionated security baseline for an AI platform team.
    verified: '2026-08-25'
  - id: nist-ai-100-2
    name: NIST AI 100-2 — Adversarial ML Taxonomy
    org: NIST
    category: security
    kind: standard
    jurisdiction: US
    url: https://csrc.nist.gov/pubs/ai/100/2/e2025/final
    status: Published
    summary: Standardised taxonomy of adversarial machine learning attacks and mitigations;
      the March 2025 edition names AI agents as a threat surface.
    best_for: Precise vocabulary for evasion, poisoning and extraction attacks.
    verified: '2026-08-25'

  # -------------------------------------------------- Frontier Safety Policies
  - id: anthropic-rsp
    rank: 1
    name: Responsible Scaling Policy
    org: Anthropic
    category: frontier
    kind: policy
    url: https://www.anthropic.com/rsp
    status: Active
    summary: AI Safety Levels tied to capability thresholds, with defined safeguards that
      must be in place before a model crossing a threshold is deployed.
    best_for: A worked example of pre-commitment governance with hard gates.
    verified: '2026-08-25'
  - id: openai-preparedness
    name: Preparedness Framework
    org: OpenAI
    category: frontier
    kind: policy
    url: https://openai.com/preparedness/
    status: Active
    summary: Tracked capability categories with thresholds and required safeguards before
      deployment or further scaling.
    best_for: Comparing how labs define and measure dangerous capability.
    verified: '2026-08-25'
  - id: gdm-frontier-safety
    name: Frontier Safety Framework
    org: Google DeepMind
    category: frontier
    kind: policy
    url: https://deepmind.google/discover/blog/introducing-the-frontier-safety-framework/
    status: Active
    summary: Critical Capability Levels with early-warning evaluations and mitigation commitments
      triggered before capability is reached.
    best_for: Designing early-warning evals rather than post-hoc testing.
    verified: '2026-08-25'
  - id: intl-ai-safety-report
    name: International AI Safety Report
    org: Chaired by Yoshua Bengio
    category: frontier
    kind: framework
    jurisdiction: International
    url: https://internationalaisafetyreport.org/
    status: Annual + updates
    summary: The IPCC-style scientific consensus report on advanced AI capability and risk,
      backed by ~30 countries plus the EU, OECD and UN.
    best_for: A citable evidence base for board and regulator briefings.
    verified: '2026-08-25'
  - id: frontier-model-forum
    name: Frontier Model Forum
    org: FMF
    category: frontier
    kind: framework
    url: https://www.frontiermodelforum.org/
    status: Active
    summary: Industry body publishing technical reports on frontier capability assessments,
      safety frameworks and third-party assessment norms.
    best_for: Tracking where cross-lab safety practice is converging.
    verified: '2026-08-25'

  # ---------------------------------------- Evaluation Harnesses (Open Source)
  - id: inspect
    name: Inspect
    org: UK AI Security Institute
    category: harness
    kind: harness
    url: https://inspect.aisi.org.uk/
    repo: UKGovernmentBEIS/inspect_ai
    license: MIT
    status: Actively maintained
    summary: The evaluation framework a national safety institute uses on frontier models
      — solvers, scorers, tool use, multi-turn agents and human-in-the-loop, with a proper
      log viewer.
    best_for: Safety and agentic evals you need to defend to an auditor.
    verified: '2026-08-25'
  - id: lm-eval-harness
    name: LM Evaluation Harness
    org: EleutherAI
    category: harness
    kind: harness
    url: https://github.com/EleutherAI/lm-evaluation-harness
    repo: EleutherAI/lm-evaluation-harness
    license: MIT
    status: Actively maintained
    summary: The de facto standard for reproducible academic benchmarking; hundreds of tasks
      behind one interface, and the harness most published numbers come from.
    best_for: Reporting MMLU/HellaSwag-class numbers others can reproduce.
    verified: '2026-08-25'
  - id: helm
    name: HELM (Holistic Evaluation of Language Models)
    org: Stanford CRFM
    category: harness
    kind: harness
    url: https://crfm.stanford.edu/helm/
    repo: stanford-crfm/helm
    license: Apache-2.0
    status: Actively maintained
    summary: Multi-metric evaluation by design — accuracy, calibration, robustness, bias,
      toxicity, efficiency — with public leaderboards across domain variants.
    best_for: Arguing that a single accuracy score is not an evaluation.
    verified: '2026-08-25'
  - id: opencompass
    name: OpenCompass
    org: Shanghai AI Laboratory
    category: harness
    kind: harness
    url: https://github.com/open-compass/opencompass
    repo: open-compass/opencompass
    license: Apache-2.0
    status: Actively maintained
    summary: Large bilingual (EN/CN) benchmark platform with broad dataset and model coverage,
      including domain suites for finance, healthcare and law.
    best_for: Non-English and domain-specific coverage the Western harnesses miss.
    verified: '2026-08-25'
  - id: lighteval
    name: LightEval
    org: Hugging Face
    category: harness
    kind: harness
    url: https://github.com/huggingface/lighteval
    repo: huggingface/lighteval
    license: MIT
    status: Actively maintained
    summary: Lightweight, backend-agnostic evaluation pipeline used in leaderboard-style runs;
      easy to point at vLLM, TGI or an inference endpoint.
    best_for: Fast iteration when a full harness is too heavy.
    verified: '2026-08-25'
  - id: metr-task-standard
    name: METR Task Standard
    org: METR
    category: harness
    kind: harness
    url: https://github.com/METR/task-standard
    repo: METR/task-standard
    license: MIT
    status: Stable, low activity
    summary: A specification for defining autonomous-capability tasks portably, so dangerous-capability
      evaluations can be shared and re-run across organisations.
    best_for: Writing agent tasks that another lab can execute unchanged.
    verified: '2026-08-25'

  # ---------------------------------------------- Application & RAG Evaluation
  - id: ragas
    name: Ragas
    org: Exploding Gradients
    category: appeval
    kind: tool
    url: https://github.com/explodinggradients/ragas
    repo: explodinggradients/ragas
    license: Apache-2.0
    status: Actively maintained
    summary: The principled choice for RAG evaluation — faithfulness, answer relevancy, context
      precision and recall, computed with or without ground truth.
    best_for: Proving a RAG answer is actually grounded in retrieved context.
    verified: '2026-08-25'
  - id: deepeval
    name: DeepEval
    org: Confident AI
    category: appeval
    kind: tool
    url: https://github.com/confident-ai/deepeval
    repo: confident-ai/deepeval
    license: Apache-2.0
    status: Actively maintained
    summary: Pytest-style evaluation for LLM apps — G-Eval, hallucination, task completion
      and custom metrics that fail a CI build like any other test.
    best_for: Regression-testing an LLM feature in an existing Python CI pipeline.
    verified: '2026-08-25'
  - id: promptfoo
    name: promptfoo
    org: promptfoo
    category: appeval
    kind: tool
    url: https://github.com/promptfoo/promptfoo
    repo: promptfoo/promptfoo
    license: MIT
    status: Actively maintained
    summary: Declarative YAML matrix testing across prompts, providers and assertions, with
      a strong adversarial/red-team generator. Note - reported in 2026 to be acquired by OpenAI;
      still MIT-licensed, but weigh vendor neutrality.
    best_for: A/B testing a prompt or provider change without writing a harness.
    verified: '2026-08-25'
  - id: phoenix
    name: Phoenix
    org: Arize AI
    category: appeval
    kind: tool
    url: https://github.com/Arize-ai/phoenix
    repo: Arize-ai/phoenix
    license: Elastic-2.0
    status: Actively maintained
    summary: Self-hostable, OpenTelemetry-native tracing and evaluation — traces become datasets,
      datasets become evals.
    best_for: Observability and eval in one place, on your own infrastructure.
    verified: '2026-08-25'
  - id: langfuse
    name: Langfuse
    org: Langfuse
    category: appeval
    kind: tool
    url: https://github.com/langfuse/langfuse
    repo: langfuse/langfuse
    license: MIT (core)
    status: Actively maintained
    summary: Open-source LLM observability with datasets, scores, prompt management and human
      annotation queues; framework-agnostic.
    best_for: Self-hosted production tracing with an evaluation loop attached.
    verified: '2026-08-25'
  - id: trulens
    name: TruLens
    org: Snowflake
    category: appeval
    kind: tool
    url: https://github.com/truera/trulens
    repo: truera/trulens
    license: MIT
    status: Actively maintained
    summary: Feedback-function approach to RAG and agent evaluation, with a native Snowflake
      path for enterprises already on that stack.
    best_for: Snowflake-resident data and governance requirements.
    verified: '2026-08-25'
  - id: giskard
    name: Giskard
    org: Giskard AI
    category: appeval
    kind: tool
    url: https://github.com/Giskard-AI/giskard
    repo: Giskard-AI/giskard
    license: Apache-2.0
    status: Actively maintained
    summary: Automated vulnerability scanning for ML and LLM apps — hallucination, bias, prompt
      injection, harmfulness — with reports oriented to EU AI Act evidence.
    best_for: Generating compliance-shaped evidence from an automated scan.
    verified: '2026-08-25'

  # ----------------------------------------- Red Teaming & Adversarial Testing
  - id: garak
    name: garak
    org: NVIDIA
    category: redteam
    kind: tool
    url: https://github.com/NVIDIA/garak
    repo: NVIDIA/garak
    license: Apache-2.0
    status: Actively maintained
    summary: An LLM vulnerability scanner in the nmap tradition — dozens of probes for jailbreaks,
      prompt injection, data leakage, toxicity and encoding attacks.
    best_for: A first automated red-team pass on any endpoint, in one command.
    verified: '2026-08-25'
  - id: pyrit
    name: PyRIT
    org: Microsoft
    category: redteam
    kind: tool
    url: https://github.com/microsoft/PyRIT
    repo: microsoft/PyRIT
    license: MIT
    status: Actively maintained
    summary: Python Risk Identification Toolkit — orchestrators, converters and scorers for
      automating multi-turn adversarial probing of generative AI.
    best_for: Scaling a manual red-team playbook into repeatable automation.
    verified: '2026-08-25'
  - id: purple-llama
    name: Purple Llama / CyberSecEval
    org: Meta
    category: redteam
    kind: tool
    url: https://github.com/meta-llama/PurpleLlama
    repo: meta-llama/PurpleLlama
    license: Custom
    status: Active
    summary: Cybersecurity safety evaluations plus input/output guard models (Llama Guard,
      Code Shield) for insecure-code and attack-compliance testing.
    best_for: Measuring whether a coding assistant emits insecure code.
    verified: '2026-08-25'

  # ------------------------------------------------- Benchmarks & Leaderboards
  - id: lmarena
    rank: 1
    name: LMArena (Chatbot Arena)
    org: LMArena / UC Berkeley
    category: benchmark
    kind: benchmark
    url: https://lmarena.ai/
    status: Live
    summary: Pairwise human preference at scale via blind A/B voting, reported as Elo. Measures
      preference, not correctness — and is gameable by style.
    best_for: A human-preference signal to triangulate against static benchmarks.
    verified: '2026-08-25'
  - id: swe-bench
    name: SWE-bench
    org: Princeton NLP
    category: benchmark
    kind: benchmark
    url: https://www.swebench.com/
    repo: SWE-bench/SWE-bench
    license: MIT
    status: Active
    summary: Real GitHub issues resolved against real repositories, graded by whether the
      test suite passes — the reference agentic coding benchmark.
    best_for: Evaluating coding agents on work that resembles the actual job.
    verified: '2026-08-25'
  - id: epoch-ai
    name: Epoch AI Benchmarking Hub
    org: Epoch AI
    category: benchmark
    kind: tracker
    url: https://epoch.ai/data
    status: Continuously updated
    summary: Independent, methodologically careful tracking of model capability, compute and
      trends, with data and methodology published openly.
    best_for: Trend claims that will survive scrutiny.
    verified: '2026-08-25'

  # ----------------------------------- Transparency, Documentation & Incidents
  - id: fmti
    name: Foundation Model Transparency Index
    org: Stanford CRFM
    category: transparency
    kind: benchmark
    url: https://crfm.stanford.edu/fmti/
    status: Periodic
    summary: Scores major developers across ~100 transparency indicators covering data, labour,
      compute, capability and downstream use.
    best_for: Benchmarking your own disclosure against the field.
    verified: '2026-08-25'
  - id: model-cards
    rank: 1
    name: Model Cards for Model Reporting
    org: Google Research
    category: transparency
    kind: framework
    url: https://arxiv.org/abs/1810.03993
    status: Foundational
    summary: The original documentation pattern — intended use, out-of-scope use, disaggregated
      performance, ethical considerations. Now referenced by ISO/IEC 42001 and the EU AI Act's
      documentation duties.
    best_for: The minimum viable artefact for any model you ship.
    verified: '2026-08-25'
  - id: datasheets
    name: Datasheets for Datasets
    org: Gebru et al.
    category: transparency
    kind: framework
    url: https://arxiv.org/abs/1803.09010
    status: Foundational
    summary: Structured documentation of dataset motivation, composition, collection and recommended
      uses — the dataset counterpart to a model card.
    best_for: Data provenance evidence that auditors will ask for.
    verified: '2026-08-25'
  - id: aiid
    name: AI Incident Database
    org: Responsible AI Collaborative
    category: transparency
    kind: tracker
    url: https://incidentdatabase.ai/
    repo: responsible-ai-collaborative/aiid
    license: MIT
    status: Continuously updated
    summary: Indexed, citable record of real-world AI harms — the empirical base for risk
      assessments that would otherwise be speculative.
    best_for: Grounding a risk register in incidents that actually happened.
    verified: '2026-08-25'
