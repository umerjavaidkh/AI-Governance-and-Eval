# =============================================================================
#  AI Governance and Eval — Agent Configuration
# =============================================================================
# Edit this file to change what the auto-update agent collects and how it
# categorizes results. No code changes needed.
#
# INTAKE IS HYBRID, and that is the whole design:
#
# Ordering inside a category: tier, then `rank:` from curated.yaml (lower is
# more prominent, default 100), then stars. Rank is what puts the EU AI Act
# above ISO/IEC 23894 when neither has a star count to sort on.
#
#   Tier 1  curated  — authoritative frameworks with no GitHub presence at all
#                      (EU AI Act, NIST AI RMF, ISO/IEC 42001, OWASP, MITRE
#                      ATLAS). Human-maintained in data/curated.yaml. A star
#                      threshold can never discover these, and they are the
#                      entries a compliance reader actually came for.
#   Tier 2  verified — open-source tools a human has vetted and pinned in
#                      data/curated.yaml with a `repo:`. The agent refreshes
#                      their stars but never removes them.
#   Tier 3  found    — auto-discovered from the GitHub Search API. Labelled 🔎
#                      in the README as unverified until someone promotes them
#                      into curated.yaml.
#
# Stars measure fame, not trustworthiness. Tier is what this list sorts on.
# -----------------------------------------------------------------------------

# Minimum stars for TIER 3 DISCOVERY ONLY. Curated entries ignore this.
#
# Deliberately low compared with a general "famous AI repos" list: the serious
# governance tooling is small. Inspect (the UK AI Security Institute's own eval
# framework) sits around 2.6k stars and garak around 9k. A 20k threshold would
# return ChatGPT wrappers and exclude every tool an auditor would recognise.
min_stars: 400

# How many result pages (100 repos each) to pull per search topic.
# GitHub's Search API caps each query at 1000 results (10 pages).
pages_per_topic: 2

# Cap on how many entries are listed per category in the README.
max_per_category: 15

# How many repos to show in "📈 Momentum" (biggest star gains since the last
# run). Needs at least 2 runs of history to populate.
trending_count: 8

# Max entries from any single category in the Momentum table. Without this,
# one hot category fills all ten rows and the section stops being useful.
trending_per_category: 3

# ---------------------------------------------------------------------------
# Spotlights — a one-line "why this is the pick" hook for the #1 entry in each
# category. Cached per entry in data/collection.json (field: "spotlight"),
# only regenerated when a category gets a new leader, silently skipped if the
# API key isn't set.
#
#   anthropic -> ANTHROPIC_API_KEY   (default model: claude-haiku-4-5-20251001)
#   openai    -> OPENAI_API_KEY      (default model: gpt-4o-mini)
# ---------------------------------------------------------------------------
spotlights:
  enabled: true
  provider: "openai"
  model: "gpt-4o-mini"

# ---------------------------------------------------------------------------
# Quality gate — applies to TIER 3 discovery only.
# ---------------------------------------------------------------------------
quality:
  require_description: true # skip repos with no description
  exclude_archived: true # skip archived / read-only repos
  exclude_forks: true # skip forks
  exclude_disabled: true # skip disabled repos
  max_months_since_push: 18 # skip repos with no commits in this many months

# Repos to permanently exclude by "owner/name".
# Discovery on these topics drags in tutorials, prompt collections and course
# repos that are not governance or evaluation tooling.
blocklist:
  - "f/prompts.chat"
  - "tw93/Pake"

# What to do with TIER 3 discoveries:
#
#   candidates — (default) list them in a collapsed "Candidates for review"
#                section at the bottom, OUT of the main category tables.
#   inline     — mix them into the category tables, marked 🔎.
#
# `candidates` is the honest default. GitHub topics are self-declared: the
# `ai-safety` and `ai-governance` tags are applied by anyone shipping an agent
# product, so a topic match is evidence that someone *claimed* relevance, not
# that the project is trustworthy. Publishing unreviewed hits directly into a
# list whose whole pitch is trustworthiness would undercut the pitch. Promotion
# to the main list stays a human decision, made by moving the entry into
# data/curated.yaml.
discovery_mode: candidates

# Minimum categorisation score for a TIER 3 discovery to be kept.
# A maintainer-set topic is worth 3, a name/description keyword is worth 1, so
# the default of 3 means "at least one explicit topic match". Keyword-only hits
# are almost all noise on these search topics — GitHub's `ai-governance` and
# `ai-safety` tags attract every agent startup on the platform.
min_discovery_score: 3

# Substrings in a repo name/description that disqualify it from discovery.
# Cheaper and more durable than blocklisting star-farmed repos one at a time.
reject_keywords:
  - "awesome-chatgpt"
  - "chatgpt clone"
  - "free api"
  - "jailbreak prompts collection"
  - "interview questions"
  - "paste-ready"
  - "a source-grounded course"
  - "roadmap to becoming"

# ---------------------------------------------------------------------------
# Search topics for TIER 3 discovery.
# ---------------------------------------------------------------------------
search_topics:
  - llm-evaluation
  - model-evaluation
  - rag-evaluation
  - agent-evaluation
  - llm-eval
  - evaluation
  - benchmark
  - llmops
  - observability
  - red-teaming
  - llm-security
  - prompt-injection
  - guardrails
  - ai-governance
  - responsible-ai
  - ai-ethics
  - fairness
  - explainable-ai
  - interpretability
  - model-monitoring
  - drift-detection
  - ai-safety

# ---------------------------------------------------------------------------
# Categories — a repo is SCORED against every category and assigned to the best
# match, not the first one that happens to hit.
#
#   topic match   = 3 points   (a maintainer explicitly tagged it)
#   keyword match = 1 point    (heuristic on name + description)
#
# Ties break by the order below, so put more specific categories higher.
#
# The original first-match-wins approach mis-sorted big repos in a way that was
# visible on the front page: huggingface/transformers carries the topic
# `speech-recognition`, so a Speech category listed above LLMs captured it and
# stopped looking. Scoring fixes that class of error without hand-tuning.
# ---------------------------------------------------------------------------
categories:
  - name: "🧪 LLM, Agent & RAG Evaluation"
    slug: eval
    blurb: "Repos you point at a model, an agent or a RAG pipeline to measure whether it actually works — harnesses, benchmarks, RAG/app eval, and adversarial testing."
    topics: [llm-evaluation, model-evaluation, rag-evaluation, agent-evaluation, benchmark,
             benchmarking, eval, evals, llmops, observability, tracing, red-teaming,
             prompt-injection, adversarial-attacks, llm-security]
    keywords: ["eval harness", "evaluation harness", "llm evaluation", "model evaluation",
               "rag evaluation", "agent evaluation", benchmark, "lm-eval", helm, inspect,
               opencompass, ragas, deepeval, promptfoo, langfuse, "llm-as-judge", tracing,
               observability, "red team", jailbreak, "prompt injection", adversarial,
               guardrail, "test suite", scoring, "unit test"]

  - name: "🏛️ AI Governance Platforms"
    slug: governance
    blurb: "Repos you run as part of a governance programme — model risk assessment, fairness and bias testing, explainability, drift and production monitoring, incident tracking, and audit evidence."
    topics: [ai-governance, responsible-ai, ai-ethics, fairness, bias-detection,
             explainable-ai, interpretability, model-monitoring, drift-detection,
             model-cards, ai-risk-management, compliance, mlops-governance]
    keywords: ["ai governance", "responsible ai", "model governance", "risk management",
               fairness, bias, explainab, interpretab, "model card", "impact assessment",
               audit, "incident database", "drift detection", monitoring, observability,
               lineage, "data governance", provenance, compliance, "trustworthy ai",
               transparency, privacy, redaction]

fallback_category:
  name: "✨ Other Eval & Governance Tooling"
  slug: other
  blurb: "Repos that clearly serve evaluation or governance but do not sit cleanly in either domain above."

